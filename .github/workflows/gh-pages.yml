# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - run: pip3 install -r songs-mkdocs-req.txt
      # Each mkdocs config below sets its own site_dir under site/
      # (e.g. songs-mkdocs.yml uses site_dir: ./site/Songs), so the three
      # builds land in separate subfolders and get combined rather than
      # overwriting one another
      - run: |
          mkdocs build -f songs-mkdocs.yml
      - run: |
          if [ -n "${{ vars.CUSTOM_SITE }}" ]; then
            echo "${{ vars.CUSTOM_SITE }}" > site/CNAME
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/Songs/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
